name: core-veles-platform
description: Files shared by Core and Veles only (no MQ worker stack, no HMD extensions).
canonical_project: core
applicable_projects:
  - core
  - veles
src_paths:
  # C/V pair files whose HMD variants differ by design:
  # config/__init__.py is empty here (HMD import the Celery app).
  # pyproject.toml removed 2026-07-24: legitimately per-project — each
  # project carries its own coverage fail_under ratchet, so
  # byte-identity is impossible by design. (The coverage *basis* was
  # aligned to ["apps", "config"] across all five in the 2026-07-24
  # calibration pass.) Tool-config (ruff/bandit) alignment is reviewed
  # manually at calibration passes (same rationale as the
  # hmd-platform.yaml removal).
  - config/__init__.py
root_paths:
  # No celery/flower COPY lines (MQ stack) and no project-specific dnf blocks;
  # HMD variants of these files live in hmd-platform.yaml.
  - containers/compose/server.yml
  # gthread worker model (HMD switched to gevent for MQ dispatch;
  # their variant lives in message-queue.yaml)
  - containers/server/django/start
  - containers/local/base/Dockerfile
  - containers/server/base/Dockerfile
root_excludes: []
project_name_insensitive:
  # These embed the project name (src/<project>-django copies,
  # ${PROJECT_IMAGE_TAG} tokens) but are structurally identical.
  - root:containers/compose/server.yml
  - root:containers/local/base/Dockerfile
  - root:containers/server/base/Dockerfile
  # Embeds the migrate unit's own name (container-<project>-migrate.service).
  - root:containers/server/django/start
expected_drift:
  # Project-name normalization also strips the English word "core" from
  # Core's gunicorn worker-count comment ("... for 4-core server"),
  # which Veles' copy never had to begin with — a false-positive match
  # on "core" the CPU-core word, not "core" the project name. No actual
  # content differs once that one comment line is set aside.
  - root:containers/server/django/start
