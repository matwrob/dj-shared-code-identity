name: hmd-platform
description: Hub/Mailman/Doccreator Tier-A platform files migrated from their byte-identical manifests.
canonical_project: hub
applicable_projects:
  - hub
  - mailman
  - doccreator
src_paths:
  - apps/common_celery/**/*.py
  - apps/tools_mq/**/*.py
  - apps/jinja/**/*.py
  - apps/artifacts/**/*.py
  - apps/blueprints/**/*.py
  - apps/attachments/**/*.py
  - apps/config.py
  - apps/utils.py
  - apps/__init__.py
  - .dockerignore
  - manage.py
  - config/__init__.py
  - config/asgi.py
  - config/context_processors.py
  - config/middleware.py
  # base/local/server/__init__ settings are all-five files owned by
  # base.yaml; here only the HMD-scope module.
  - config/settings/hmd.py
  - config/urls/shared/hmd.py
  - config/wsgi.py
  - pyproject.toml
  - requirements/shared/hmd.in
  - templates/admin/403.html
  - templates/admin/404.html
  - templates/admin/500.html
  - templates/admin/base_site.html
  - templates/admin/db_unavailable.html
  - templates/admin/blueprints/**/*.html
  - static/admin/css/admin_base.css
  - static/admin/css/production.css
  - static/admin/css/uat.css
  - tests/unit/jinja/**/*.py
  - tests/unit/tools_mq/**/*.py
  # MQ-stack tests for the otherwise all-five health app (excluded
  # from base.yaml).
  - tests/unit/health/services/test_celery_check.py
  - tests/unit/health/services/test_flower_check.py
  - tests/unit/health/services/test_rabbitmq_check.py
  - tests/unit/artifacts/**/*.py
  - tests/unit/blueprints/**/*.py
  - tests/unit/attachments/**/*.py
  - tests/integration/test_admin_blueprint_tests_render.py
  - tests/integration/test_blueprints_checks.py
  - tests/integration/test_blueprints_render.py
  - tests/hmd_fixtures.py
  - tests/factories/artifacts.py
  - tests/factories/blueprints.py
  - tests/unit/test_config.py
  - tests/unit/test_init.py
  - tests/unit/test_utils.py
  - tests/integration/common_celery/**/*.py
  - tests/integration/test_admin_file_upload.py
  - tests/integration/test_artifact_deletion.py
  - tests/integration/test_jinja_template_dependencies.py
  - tests/integration/test_openapi_schema.py
  - tests/e2e/ui/test_file_uploads.py
src_excludes:
  - apps/artifacts/migrations/**
  - apps/blueprints/migrations/**
root_paths:
  # All-five container files live in base.yaml; MQ worker scripts live in
  # message-queue.yaml. Here: files whose HMD shape differs from Core/Veles
  # (celery/flower COPY lines in the Dockerfiles).
  - containers/local/base/Dockerfile
  - containers/server/base/Dockerfile
  - docs/shared/**
  - scripts/shared-code-manifest.txt
  - scripts/verify-shared-identity.sh
  - scripts/sync-shared-from.sh
root_excludes: []
project_name_insensitive:
  # Structurally identical modulo the project's own name; DocCreator is
  # expected to drift until its WeasyPrint dnf block is parameterized.
  - root:containers/local/base/Dockerfile
  - root:containers/server/base/Dockerfile
