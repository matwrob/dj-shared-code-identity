name: hmd-platform
description: Hub/Mailman/Doccreator Tier-A platform files migrated from their byte-identical manifests.
canonical_project: hub
applicable_projects:
  - hub
  - mailman
  - doccreator
src_paths:
  - apps/common_celery/**/*.py
  - apps/authentication/**/*.py
  - apps/health/**/*.py
  - apps/error_handlers/**/*.py
  - apps/jinja/**/*.py
  - apps/audit/**/*.py
  - apps/tools/**/*.py
  - apps/artifacts/**/*.py
  - apps/blueprints/**/*.py
  - apps/common/**/*.py
  - apps/attachments/**/*.py
  - apps/config.py
  - apps/utils.py
  - apps/__init__.py
  - .dockerignore
  - manage.py
  - config/__init__.py
  - config/asgi.py
  - config/celery.py
  - config/context_processors.py
  - config/middleware.py
  - config/settings/__init__.py
  - config/settings/base.py
  - config/settings/local.py
  - config/settings/server.py
  - config/urls.py
  - config/wsgi.py
  - pyproject.toml
  - requirements/server.txt
  - requirements/shared-dev.txt
  - requirements/shared.txt
  - templates/admin/403.html
  - templates/admin/404.html
  - templates/admin/500.html
  - templates/admin/base_site.html
  - templates/admin/db_unavailable.html
  - templates/admin/blueprints/**/*.html
  - static/admin/css/admin_base.css
  - static/admin/css/production.css
  - static/admin/css/uat.css
  - apps/tests/unit/authentication/**/*.py
  - apps/tests/unit/health/**/*.py
  - apps/tests/unit/error_handlers/**/*.py
  - apps/tests/unit/jinja/**/*.py
  - apps/tests/unit/audit/**/*.py
  - apps/tests/unit/tools/**/*.py
  - apps/tests/unit/artifacts/**/*.py
  - apps/tests/unit/blueprints/**/*.py
  - apps/tests/unit/attachments/**/*.py
  - apps/tests/integration/test_admin_blueprint_tests_render.py
  - apps/tests/integration/test_blueprints_checks.py
  - apps/tests/integration/test_blueprints_render.py
  - apps/tests/unit/common/**/*.py
  - apps/tests/__init__.py
  - apps/tests/base_fixtures.py
  - apps/tests/unit/test_config.py
  - apps/tests/unit/test_init.py
  - apps/tests/unit/test_utils.py
  - apps/tests/integration/common_celery/**/*.py
  - apps/tests/config/test_celery.py
  - apps/tests/config/test_context_processors.py
  - apps/tests/config/test_middleware.py
  - apps/tests/integration/test_admin_file_upload.py
  - apps/tests/integration/test_artifact_deletion.py
  - apps/tests/integration/test_jinja_template_dependencies.py
  - apps/tests/integration/test_openapi_schema.py
  - apps/tests/e2e/ui/test_file_uploads.py
  - apps/tests/seed.json
  - apps/tests/test_db_base.json
src_excludes:
  - apps/audit/migrations/**
  - apps/artifacts/migrations/**
  - apps/blueprints/migrations/**
  - apps/common/migrations/**
root_paths:
  - containers/local/django/entrypoint
  - containers/server/django/entrypoint
  - containers/common/start-flower
  - containers/local/django/start
  - containers/local/celery/start
  - containers/server/django/start
  - containers/server/celery/start
  - containers/compose/infra.yml
  - containers/local/oracle/init/01_init.sql
  - containers/local/oracle/init/02_health_check.sql
  - containers/local/rabbitmq/definitions.json
  - containers/local/rabbitmq/rabbitmq.conf
  - dc.bat
  - dc-infra.sh
  - dc-infra.bat
  - deployment/build_push/VERSION.example
  - docs/shared/**
  - scripts/shared-code-manifest.txt
  - scripts/verify-shared-identity.sh
  - scripts/sync-shared-from.sh
root_excludes: []
