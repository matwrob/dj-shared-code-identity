name: message-queue
description: Celery, RabbitMQ, Flower, and worker stack files shared by all five projects. The MQ stack is a dedicated, additive scope — a project opts in via config.settings.project (apply_mq_settings + tools_mq app + shared/mq urls); base stays MQ-free so future non-MQ projects need none of this.
canonical_project: hub
applicable_projects:
  - hub
  - mailman
  - doccreator
  - core
  - veles
  - visor
src_paths:
  - apps/common_celery/**/*.py
  # Flower/RabbitMQ admin proxy — MQ machinery (moved here from
  # hmd-platform.yaml when Core/Veles onboarded the stack, 2026-07-26).
  - apps/tools_mq/**/*.py
  - apps/health/services/celery_check.py
  - apps/health/services/flower_check.py
  - apps/health/services/rabbitmq_check.py
  - tests/integration/common_celery/**/*.py
  - tests/unit/tools_mq/**/*.py
  - tests/unit/health/services/test_celery_check.py
  - tests/unit/health/services/test_flower_check.py
  - tests/unit/health/services/test_rabbitmq_check.py
  - tests/config/test_celery.py
  # Guards the config/__init__.py re-export below; unlike
  # test_celery.py it does not import config.celery itself, so it
  # fails when the package-level registration is missing.
  - tests/config/test_celery_registration.py
  - tests/common_celery_safety.py
  # Registers the Celery app on Django startup (web/test processes,
  # not only the worker CLI): without it, @shared_task publishing
  # from a web process uses an unconfigured default app and
  # django-structlog never binds task_id outside the worker.
  # Missing from this manifest until 2026-08-06 — exactly how Veles
  # and Core shipped with an empty config/__init__.py.
  - config/__init__.py
  - config/celery.py
  - config/settings/mq.py
  - config/urls/shared/mq.py
  - requirements/shared/mq.in
src_excludes: []
root_paths:
  # RabbitMQ broker configs live in base.yaml: the broker is shared infra
  # that any of the five projects may start, so all five copies must match.
  - containers/common/start-flower
  # gevent worker model (gthread blocked OS threads on RabbitMQ
  # dispatch, soak test May 2026); Core/Veles keep gthread — see
  # expected_drift below.
  - containers/server/django/start
  - containers/local/celery/start
  - containers/server/celery/start
root_excludes: []
expected_drift:
  # H/M/D run the gunicorn gevent worker class (RabbitMQ dispatch from
  # web workers); Core/Veles deliberately keep gthread — their web tier
  # does not dispatch over MQ on the request path. Documented, allowed
  # drift; guarded per project by
  # tests/config/test_deployment_wiring.py.
  - root:containers/server/django/start
