[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-code-identity"
version = "0.1.0"
description = "Verify byte-identical shared code across related projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Workspace Maintainers" },
]
dependencies = []

[project.scripts]
verify-shared-code = "shared_code_identity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
